<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dein Termin</title>
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>
  <main class="booking">
    <h1>Dein Termin</h1>
    <p class="muted" id="loading">Wird geladen …</p>
    <p class="error" id="error" role="alert" hidden></p>

    <section id="view" hidden>
      <p class="summary" id="details"></p>
      <p id="video" hidden></p>
      <div id="actions" class="actions">
        <button type="button" id="btn-reschedule">Verschieben</button>
        <button type="button" id="btn-cancel" class="danger">Absagen</button>
      </div>
      <p class="muted" id="locked" hidden></p>
    </section>

    <section id="reschedule" hidden>
      <h2>Neuen Termin wählen</h2>
      <div id="picker" aria-live="polite"></div>
      <p class="summary" id="new-summary" hidden></p>
      <button type="button" class="primary" id="btn-confirm-new" hidden>Termin verschieben</button>
    </section>

    <section id="result" hidden aria-live="polite"><h2 id="result-title"></h2><p id="result-text"></p><p><a href="./">Neuen Termin buchen</a></p></section>
  </main>
  <script type="module" src="js/termin.js"></script>
</body>
</html>
